<!doctype html>
<html lang="en" class="dark scroll-smooth" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2'/><circle cx='9' cy='7' r='4'/><path d='M22 21v-2a4 4 0 0 0-3-3.87'/><path d='M16 3.13a4 4 0 0 1 0 7.75'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <title>AttendanceX - Smart University Attendance SaaS Platform</title>
    <meta name="description" content="Next-generation university attendance SaaS platform for real-time roll call, theory & lab tracking, SQLite3 persistence, and semester percentage metrics." />
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono with display=swap -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GIS) for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Permanent Dark Mode Initialization -->
    <script>
      (function() {
        try {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          localStorage.removeItem('attendancex_theme');
          localStorage.removeItem('theme');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-[#030712] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
